name: Build Cross image

on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile-cross-centos
      - .github/workflows/cross-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Cross image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-cross-centos
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/cross-x86_64-unknown-linux-gnu-centos-cmake:3.29.8
            ghcr.io/${{ github.repository }}/cross-x86_64-unknown-linux-gnu-centos-cmake:latest
          build-args: |
            CMAKE_VERSION=3.29.8
          cache-from: type=gha
          cache-to: type=gha,mode=max
